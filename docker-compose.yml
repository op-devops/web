# 前端静态站。构建产物由 OpenResty 托管,/api 反代到 APISIX。
#
#   docker compose up -d --build
#   打开 http://127.0.0.1:8080
#
# 必须和 APISIX 在同一个网络(devops-net),否则 nginx.conf 里的 `apisix` 解析不到。
# 那个网络由中间件栈创建:cd ../middreware && docker compose up -d

services:
  web:
    build:
      context: .
      args:
        # 国内网络换源;海外构建传空值或删掉这行
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ops-web:latest
    container_name: ops-web
    restart: unless-stopped
    ports:
      # 只绑 127.0.0.1:要对外提供服务时再改成 "80:80",
      # 别的端口(mysql/redis/nacos)也建议照这个办法收一收
      - "0.0.0.0:8080:80"
    networks:
      default:
        aliases:
          - ops-web

# 加入全局中间件栈所在的网络(APISIX 在里面)
networks:
  default:
    name: ${INFRA_NETWORK:-devops-net}
    external: true
