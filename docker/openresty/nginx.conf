# 前端静态站 + /api 反代到 APISIX。
#
# 跟开发期 vite 的 server.proxy 是同一套映射,保证"本地好使 = 线上好使":
#   浏览器请求   /api/auth/login
#   这里改写成   /auth-api/auth/login   -> APISIX
#   APISIX 剥前缀 /auth/login           -> 业务网关(随机端口,Nacos 服务发现)

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志里记真实客户端 IP:这一层是链路最外侧,$remote_addr 就是浏览器地址
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    # WebSocket 升级:请求带 Upgrade 头时 Connection 置 upgrade,普通请求置 close。
    # terminal 的 ws/ssh、ws/monitor 靠它把连接升级透传到 APISIX。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # APISIX 在同一个 docker 网络里,按服务名解析。
    # resolver 指向 docker 内嵌 DNS:容器重建后 IP 会变,不能让 nginx 在启动时
    # 把地址解析一次就缓存死——那样 APISIX 一重启这里就一直 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 带 hash 的构建产物可以长缓存(文件名变了就是新文件)
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html 不能缓存,否则发版后用户还拿旧的资源清单
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        location /api/cmdb/ {
            # cmdb 网关。前缀 location 按最长匹配,/api/cmdb/ 比下面的 /api/ 优先
            # 变量形式的 proxy_pass 才会走上面的 resolver 做运行时解析
            set $apisix_upstream "http://apisix:9080";
            rewrite ^/api/cmdb/(.*)$ /cmdb-api/$1 break;
            proxy_pass $apisix_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            # 这三个头决定后端能不能拿到真实客户端 IP。
            # 链路是 浏览器 -> 本容器 -> APISIX -> 业务网关,
            # 网关的 forwarded_allow_ips 要同时信任本容器和 APISIX 所在网段,
            # uvicorn 才会从右往左跳过代理找到最左边的真实客户端。
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        location /api/terminal/ {
            # terminal 网关。既有普通 HTTP(会话列表/回放下载),又有 WebSocket
            # (ws/ssh 终端、ws/monitor 监控),所以比 cmdb 多了 Upgrade/Connection 升级头
            # 和更长的读超时(空闲终端不能被 nginx 默认 60s 读超时掐断)。
            set $apisix_upstream "http://apisix:9080";
            rewrite ^/api/terminal/(.*)$ /terminal-api/$1 break;
            proxy_pass $apisix_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            # WebSocket 升级头:普通请求时 $connection_upgrade=close,等价于不升级
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 5s;
            # WS 长连接:空闲(无输入无输出)时也别断,交给网关的 webshell.idle_timeout 控制
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
        }

        location /api/cron/ {
            set $apisix_upstream "http://apisix:9080";
            rewrite ^/api/cron/(.*)$ /cron-api/$1 break;
            proxy_pass $apisix_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            # 这三个头决定后端能不能拿到真实客户端 IP。
            # 链路是 浏览器 -> 本容器 -> APISIX -> 业务网关,
            # 网关的 forwarded_allow_ips 要同时信任本容器和 APISIX 所在网段,
            # uvicorn 才会从右往左跳过代理找到最左边的真实客户端。
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # auth 网关:显式列出它拥有的顶级前缀(auth 新增顶级资源时在这里加一个)。
        # 用正则而不是一条 /api/ 兜底,是为了让未知路径不再默默进 auth——见下面的 404。
        # 正则 location 的优先级高于 /api/ 前缀,所以命中这些前缀的会走这里。
        location ~ ^/api/(auth|users|roles|self|login-history)(/|$) {
            set $apisix_upstream "http://apisix:9080";
            rewrite ^/api/(.*)$ /auth-api/$1 break;
            proxy_pass $apisix_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            # 这三个头决定后端能不能拿到真实客户端 IP。
            # 链路是 浏览器 -> 本容器 -> APISIX -> 业务网关,
            # 网关的 forwarded_allow_ips 要同时信任本容器和 APISIX 所在网段,
            # uvicorn 才会从右往左跳过代理找到最左边的真实客户端。
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # 未命中任何服务前缀的 /api/ 请求:明确 404。
        # 以前这里是兜底进 auth,任何拼错/未迁移的路径都伪装成 auth 报错,极难排查。
        location /api/ {
            return 404;
        }

        # SPA 兜底。当前是 hash 路由(VITE_ROUTER_HISTORY=hash),用不上;
        # 哪天切成 history 路由,刷新子路径就靠这一行。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
